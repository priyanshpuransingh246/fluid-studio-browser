      - name: Step 3 - Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Step 4 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Step 5 - Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Step 6 - Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Step 7 - Upload Ready-to-Install Fluid Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluid-Studio-Multiplicator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
