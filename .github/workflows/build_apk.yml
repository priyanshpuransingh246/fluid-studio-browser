      - name: Step 3 - Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Step 4 - Compile & Sign APK Directly with Android SDK Tools (Zero Maven/Gradle Dependencies)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PLATFORM_JAR=$(ls -d "$SDK_ROOT"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using Platform: $PLATFORM_JAR"
          echo "Using Build-Tools: $BUILD_TOOLS"

          mkdir -p build/classes build/dex app/build/outputs/apk/debug

          # 1. Compile Java sources
          javac -source 17 -target 17 -encoding UTF-8 \
            -cp "$PLATFORM_JAR" \
            -d build/classes \
            app/src/main/java/com/itihaskar/browser/MainActivity.java

          # 2. Convert .class files to classes.dex using d8
          "$BUILD_TOOLS/d8" --lib "$PLATFORM_JAR" \
            --output build/dex \
            build/classes/com/itihaskar/browser/*.class

          # 3. Link AndroidManifest.xml with aapt2
          "$BUILD_TOOLS/aapt2" link \
            -o build/unaligned.apk \
            -I "$PLATFORM_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --auto-add-overlay

          # 4. Package classes.dex and assets/ into the APK
          cp build/dex/classes.dex .
          zip -q -j build/unaligned.apk classes.dex
          (cd app/src/main && zip -q -r ../../../build/unaligned.apk assets/)

          # 5. Zipalign & Sign the APK (v1 + v2 + v3 signatures)
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/debug/app-debug.apk \
            build/aligned.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Step 5 - Upload Ready-to-Install Fluid Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluid-Studio-Multiplicator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
