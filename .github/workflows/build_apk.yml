      - name: "Step 3 - Set up Java JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Step 4 - Setup Android SDK"
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: "Step 5 - Setup Gradle 8.5"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: "Step 6 - Compile Debug APK"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: "Step 7 - Upload Ready-to-Install Fluid Studio APK"
        uses: actions/upload-artifact@v4
        with:
          name: Fluid_Studio_Auto_Browser_APK
          path: app/build/outputs/apk/debug/app-debug.apk
