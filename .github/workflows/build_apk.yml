      - name: Step 3 - Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Step 4 - Compile & Sign Universal Tablet/Mobile APK (API 24-34)
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          # Strictly select stable android-34 or android-33 (NEVER preview android-35/36/Baklava!)
          if [ -f "$SDK_ROOT/platforms/android-34/android.jar" ]; then
            PLATFORM_JAR="$SDK_ROOT/platforms/android-34/android.jar"
          elif [ -f "$SDK_ROOT/platforms/android-33/android.jar" ]; then
            PLATFORM_JAR="$SDK_ROOT/platforms/android-33/android.jar"
          else
            PLATFORM_JAR=$(ls -d "$SDK_ROOT"/platforms/android-[0-9]* | sort -V | tail -n 1)/android.jar
          fi

          # Select stable build-tools 34.x or 33.x
          if ls -d "$SDK_ROOT"/build-tools/34.* >/dev/null 2>&1; then
            BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/34.* | sort -V | tail -n 1)
          else
            BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/[0-9]* | grep -v -- "-rc" | sort -V | tail -n 1)
          fi

          echo "Using Stable Platform: $PLATFORM_JAR"
          echo "Using Stable Build-Tools: $BUILD_TOOLS"

          mkdir -p build/classes build/dex app/build/outputs/apk/debug

          # 1. Compile Java sources targeting Java 11 bytecode for maximum Android compatibility
          javac -source 11 -target 11 -encoding UTF-8 \
            -cp "$PLATFORM_JAR" \
            -d build/classes \
            app/src/main/java/com/itihaskar/browser/MainActivity.java

          # 2. Convert .class files to classes.dex with explicit --min-api 24 (DEX 035)
          "$BUILD_TOOLS/d8" \
            --min-api 24 \
            --lib "$PLATFORM_JAR" \
            --output build/dex \
            build/classes/com/itihaskar/browser/*.class

          # 3. Link AndroidManifest.xml with explicit minSdkVersion=24 and targetSdkVersion=34
          "$BUILD_TOOLS/aapt2" link \
            -o build/unaligned.apk \
            -I "$PLATFORM_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 25 \
            --version-name "25.0" \
            --auto-add-overlay

          # 4. Package classes.dex and assets/ into the APK
          cp build/dex/classes.dex .
          zip -q -j build/unaligned.apk classes.dex
          (cd app/src/main && zip -q -r ../../../build/unaligned.apk assets/)

          # 5. Zipalign & Sign the APK (v1 + v2 + v3 signatures)
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/debug/app-debug.apk \
            build/aligned.apk

          "$BUILD_TOOLS/apksigner" verify -v app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Step 5 - Upload Ready-to-Install Fluid Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluid-Studio-Multiplicator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
